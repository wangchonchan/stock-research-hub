[build]
  command = "pip install -r requirements.txt && pnpm install && pnpm build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
  PYTHON_VERSION = "3.10"

[functions]
  included_files = ["research_engine.py"]

[[redirects]]
  from = "/api/stock-research"
  to = "/.netlify/functions/stock-research-api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
